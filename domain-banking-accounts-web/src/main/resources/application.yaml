spring:
  application:
    name: domain-banking-accounts
    version: 1.0.0
    description: Domain layer service for banking account orchestration
    team:
      name: Firefly Software Foundation
      email: dev@getfirefly.io

  threads:
    virtual:
      enabled: true

firefly:
  cqrs:
    enabled: true
    command:
      timeout: 30s
      metrics-enabled: true
      tracing-enabled: true
    query:
      timeout: 15s
      caching-enabled: true
      cache-ttl: 15m
  saga:
    performance:
      enabled: true
  eda:
    enabled: true
    default-publisher-type: KAFKA
    default-connection-id: default
    publishers:
      kafka:
        default:
          enabled: true
          default-topic: domain-layer
          bootstrap-servers: localhost:9092
  stepevents:
    enabled: true
  ledger:
    gl:
      opening-suspense-account-id: ${FIREFLY_LEDGER_GL_OPENING_SUSPENSE_ACCOUNT_ID:}
      holds-clearing-account-id: ${FIREFLY_LEDGER_GL_HOLDS_CLEARING_ACCOUNT_ID:}
      fee-income-account-id: ${FIREFLY_LEDGER_GL_FEE_INCOME_ACCOUNT_ID:}
  balance:
    source: ${FIREFLY_BALANCE_SOURCE:LEDGER}

api-configuration:
  core-banking:
    accounts:
      base-path: http://localhost:8081
  core-common:
    contracts:
      base-path: http://localhost:8082
  core-platform:
    banking-ledger:
      base-path: http://localhost:8083

server:
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: com.firefly.domain.banking.accounts.web.controllers
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.firefly: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.firefly: WARN
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
